start_watering:
  target:
    entity:
      integration: linktap
      domain: valve
  fields:
    seconds:
      required: true
      example: 600
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    volume:
      required: false
      example: 5
      selector:
        number:
          min: 0
          step: 0.1
          mode: box

pause:
  target:
    entity:
      integration: linktap
      domain: valve
  fields:
    hours:
      required: true
      example: 24
      selector:
        number:
          min: 0
          max: 96
          unit_of_measurement: h
          mode: box

dismiss_alert:
  target:
    entity:
      integration: linktap
      domain: binary_sensor

dismiss_alerts:
  target:
    entity:
      integration: linktap
      domain: binary_sensor
